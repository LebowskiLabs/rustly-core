# This workspace manifest helps IDEs and tooling recognize the Rust extension project.
[workspace]
members  = ["ext/rustly_core", "ext/rustly_core/crates/domain", "ext/rustly_core/crates/gateway"]
resolver = "3"

[workspace.package]
authors      = ["dude <skuf@justregulardude.ru>"]
description  = "Rust runtime compiling Rustly schemas with coercion and validation sans GVL."
edition      = "2021"
license      = "MIT"
repository   = "https://github.com/rustly/rustly-core"
rust-version = "1.91"
version      = "0.1.1"

[workspace.dependencies]
bumpalo       = { version = "3.14", features = ["collections"] }
ordered-float = { version = "5.1.0", features = ["serde"] }
rb-sys        = "0.9.117"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
smallvec      = "1.11"
thiserror     = "2.0.17"

[profile.release]
codegen-units = 1
lto           = true
strip         = true
